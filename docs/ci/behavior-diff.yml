# The behavior a pull request changes, as a comment on it (docs/adr/0036):
# what came, changed and went in its state machines and scenarios, what the
# specification checks find now or no longer, and each state machine that
# changed drawn as Mermaid, which GitHub draws in the comment. For a person
# to review by behavior what an agent or a colleague changed.
#
# Copy it to .github/workflows/ in the repository whose diagrams it reads.
# It takes Omaspec's latest release; `diff --markdown` came with 1.2.0.
name: Behavior changes

# On each push to the pull request, not only while its files include a
# diagram: once a push takes the change back they include none, and the
# comment has to say so.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      # The base branch's history too: the diagrams are compared with it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Omaspec
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo enhapu-afk/omaspec --pattern '*-x86_64-linux.tar.gz*'
          sha256sum -c omaspec-*-x86_64-linux.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/omaspec"
          tar xzf omaspec-*-x86_64-linux.tar.gz -C "$RUNNER_TEMP/omaspec" --strip-components=1
          rm omaspec-*-x86_64-linux.tar.gz*
          echo "$RUNNER_TEMP/omaspec" >> "$GITHUB_PATH"
      # 0: no diagram changed in its behavior; 1: one did; else it failed.
      - name: What changed in the behavior
        id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set +e
          omaspec diff . --rev "origin/$BASE" --markdown > "$RUNNER_TEMP/behavior.md"
          code=$?
          set -e
          case "$code" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
      # One comment, found by its first line and written again on each
      # push; where a later push leaves no diagram changed in its behavior
      # it says so. The job's summary shows the same, also for a pull
      # request from a fork, whose token may not comment.
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ steps.diff.outputs.changed }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          cat "$RUNNER_TEMP/behavior.md" >> "$GITHUB_STEP_SUMMARY"
          [ "$FORK" = true ] && exit 0
          marker='<!-- omaspec: behavior changes -->'
          { echo "$marker"; cat "$RUNNER_TEMP/behavior.md"; } > "$RUNNER_TEMP/comment.md"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          elif [ "$CHANGED" = true ]; then
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          fi

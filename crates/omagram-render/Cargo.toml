[package]
name = "omagram-render"
description = "Rendering for Omagram: routes diagrams to the engines, sanitizes SVG, exports SVG, PNG, JPEG, PDF, Markdown and ZIP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
jpeg-encoder = "0.7.1"
krilla = "0.8"
krilla-svg = "0.8"
mermaid-rs-renderer.workspace = true
resvg.workspace = true
roxmltree = "0.21"
serde_json = "1"
omagram-core.workspace = true
omagram-uml.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
omagram-model.workspace = true

[[bench]]
name = "render"
harness = false

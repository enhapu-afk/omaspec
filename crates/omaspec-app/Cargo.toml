[package]
name = "omaspec-app"
description = "Omaspec: native PlantUML and Mermaid editor for Omarchy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "omaspec"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
clap.workspace = true
iced = { workspace = true, features = ["canvas", "image-without-codecs"] }
# `image::allocate`; iced only re-exports it with all image codecs.
iced_runtime = "0.14"
landlock = "0.4"
notify = "8"
regex = "1"
# The confined PlantUML's open-file limit (`sandbox`); already in iced's tree.
rustix = { version = "1", features = ["process"] }
# Pinned: young crate, see docs/adr/0002-editor-widget-scrive.md.
scrive-core = "=0.3.0"
scrive-iced = "=0.3.0"
serde.workspace = true
serde_json = "1"
omaspec-core.workspace = true
omaspec-model.workspace = true
omaspec-render.workspace = true
omaspec-theme.workspace = true
omaspec-uml.workspace = true

[lints]
workspace = true

[dev-dependencies]
iced_test = "0.14"

# cargo-deny: licenses, advisories, bans and sources of every dependency.
# Run `cargo deny check` (CI does).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    # jpeg-encoder's DCT is derived from the Independent JPEG Group's code.
    "IJG",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Omagram works offline and reports nothing (docs/adr/0005): no HTTP, TLS
# or telemetry client may come in, not even through another crate.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
    { name = "isahc" },
    { name = "surf" },
    { name = "attohttpc" },
    { name = "rustls" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "sentry" },
    { name = "opentelemetry" },
    { name = "posthog-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]
default-members = ["crates/*"]
# Third-party code with our changes; built as dependencies, not linted or
# formatted as ours (see vendor/README.md).
exclude = ["vendor", "fuzz"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Nils Hoffmann"]
repository = "https://github.com/enhapu-afk/omaspec"
# Built from git and the AUR, not from crates.io (scrive is vendored).
publish = false

[workspace.dependencies]
omaspec-core = { path = "crates/omaspec-core" }
omaspec-uml = { path = "crates/omaspec-uml" }
omaspec-model = { path = "crates/omaspec-model" }
omaspec-render = { path = "crates/omaspec-render" }
omaspec-theme = { path = "crates/omaspec-theme" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Without linux-theme-detection, which asks the desktop over D-Bus for light
# or dark: Omaspec reads the Omarchy theme and needs no D-Bus stack.
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "x11",
    "wayland",
] }
mermaid-rs-renderer = { version = "0.3", default-features = false }
resvg = "0.47"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
scrive-core = { path = "vendor/scrive-core" }
scrive-iced = { path = "vendor/scrive-iced" }
smithay-clipboard = { path = "vendor/smithay-clipboard" }
winit = { path = "vendor/winit" }

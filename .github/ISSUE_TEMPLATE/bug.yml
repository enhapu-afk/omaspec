name: Bug or crash
description: Omaspec crashes, hangs, or an editor or CLI feature misbehaves.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: For a diagram that is drawn wrong, please use the "Diagram drawn wrong" form instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. omaspec ~/diagrams
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or backtrace
      description: Terminal output; for a crash, run with `RUST_BACKTRACE=1`.
      render: text
  - type: input
    id: version
    attributes:
      label: Omaspec version
      description: Output of `omaspec --version`, and how you installed it (omaspec-bin, source, tarball).
    validations:
      required: true
  - type: input
    id: omarchy
    attributes:
      label: Omarchy version
      description: Or your distribution; Wayland or X11.

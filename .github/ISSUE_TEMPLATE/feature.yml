name: Feature request
description: Suggest an idea for Omaspec.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please check the [roadmap](https://github.com/enhapu-afk/omaspec/blob/main/ROADMAP.md) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could Omaspec help? Example diagram sources are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives

name: Release

# A signed tag vX.Y.Z (see packaging/RELEASING.md) builds the binary for
# x86_64 and aarch64 and attaches both to a GitHub release for omaspec-bin.
# Run by hand with a tag, it builds that tag again with this workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, e.g. v0.4.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      # One architecture failing does not hold back the other's archive.
      fail-fast: false
      matrix:
        include:
          # On Arch, as Omarchy runs it.
          - arch: x86_64
            runner: ubuntu-latest
            container: archlinux:base-devel
          # Arch has no official image for ARM: built on Ubuntu, whose older
          # glibc keeps the binary running on Arch Linux ARM and the others.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: ""
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      # The renderer's tests read the labels the fonts lay out.
      - name: Tools, libraries and a font (Arch)
        if: matrix.container != ''
        run: pacman -Syu --noconfirm rust git fontconfig libxkbcommon wayland vulkan-icd-loader ttf-liberation
      - name: Libraries (Ubuntu)
        if: matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.container == ''
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Test
        run: cargo test --locked -p omaspec-core -p omaspec-theme -p omaspec-render
      - name: Build
        run: cargo build --locked --release -p omaspec-app
      - name: Package
        run: |
          version="${TAG#v}"
          dir="omaspec-$version-${{ matrix.arch }}-linux"
          mkdir -p "$dir"
          install -m755 target/release/omaspec "$dir/"
          cp LICENSE README.md packaging/omaspec.desktop packaging/omaspec.svg \
            packaging/omaspec-mime.xml "$dir/"
          # The license of the handwriting face built into the binary. A tag
          # from before it has none.
          if [ -f crates/omaspec-render/fonts/OFL.txt ]; then
            cp crates/omaspec-render/fonts/OFL.txt "$dir/"
          fi
          cp -r packaging/omarchy "$dir/omarchy"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: omaspec-${{ matrix.arch }}
          path: |
            omaspec-*.tar.gz
            omaspec-*.tar.gz.sha256
          if-no-files-found: error

  # One job writes the release, so the two builds never race to create it.
  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: omaspec-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          fail_on_unmatched_files: true
          files: |
            omaspec-*.tar.gz
            omaspec-*.tar.gz.sha256

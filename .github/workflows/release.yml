name: Release

# A signed tag vX.Y.Z (see packaging/RELEASING.md) builds the binary on Arch,
# as Omarchy runs it, and attaches it to a GitHub release for omagram-bin.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Tools and libraries
        run: pacman -Syu --noconfirm rust git fontconfig libxkbcommon wayland vulkan-icd-loader
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --locked -p omagram-core -p omagram-theme -p omagram-render
      - name: Build
        run: cargo build --locked --release -p omagram-app
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="omagram-$version-x86_64-linux"
          mkdir -p "$dir"
          install -m755 target/release/omagram "$dir/"
          cp LICENSE README.md packaging/omagram.desktop packaging/omagram.svg \
            packaging/omagram-mime.xml "$dir/"
          cp -r packaging/omarchy "$dir/omarchy"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            omagram-*.tar.gz
            omagram-*.tar.gz.sha256
